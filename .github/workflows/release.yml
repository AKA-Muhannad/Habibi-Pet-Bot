name: Draft release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - name: Build and package
        run: zsh scripts/package.sh
      - name: Test activity bridge
        run: python3 -m unittest discover -s tests -v
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Habibi-Pet-Bot-*-universal.zip dist/Habibi-Pet-Bot-universal.zip dist/SHA256SUMS.txt install.sh --draft --verify-tag --title "Habibi-Pet-Bot $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
